name = "sunsetping"
main = "src/worker.js"
compatibility_date = "2024-09-01"
account_id = "1a01a80affd778e3dc5812bbdcd5dc84"

# Secrets, set with `wrangler secret put` (never commit values):
#   RESEND_API_KEY                  — omit to log emails instead of sending
#   EMAIL_FROM                      — optional, defaults to SunsetPing <alerts@sunsetping.com>
#   NEWSLETTER_FROM                 — optional weekly From. Prefer SunsetPing <hello@sunsetping.com>.
#                                     Falls back to EMAIL_FROM, then the alerts default.
#   CRON_SECRET                     — bearer token for POST /api/cron/newsletter
#   STRIPE_WEBHOOK_SECRET           — Stripe webhook signing secret (whsec_...) for POST /api/stripe/webhook
#                                     GET /api/checkout no longer creates a session. It redirects to /#signup.
#                                     Leave old Stripe secrets in place if a webhook is still configured.
#   PUBLIC_BASE_URL                 — optional, defaults to https://sunsetping.com

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"

[triggers]
# Alert cron only (every 15 minutes). The weekly newsletter is not scheduled:
# each issue needs editorial copy, so send it with
# POST /api/cron/newsletter and `Authorization: Bearer $CRON_SECRET`.
# Deduped in alert_sends as kind "newsletter". local_date defaults to the
# Monday of that week in America/Los_Angeles, so a re-run does not double-send.
crons = ["*/15 * * * *"]

[[routes]]
pattern = "sunsetping.com"
custom_domain = true

[[routes]]
pattern = "www.sunsetping.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "sunsetping"
database_id = "e838bc78-00f2-432f-a0a0-48afcc0c4a77"
migrations_dir = "migrations"

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true
